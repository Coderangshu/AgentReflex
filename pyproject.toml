[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreflex"
version = "0.1.0"
description = "Local System 1 reflex decision engine for coding agents"
dependencies = [
    "laya>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon*", "lib*"]
