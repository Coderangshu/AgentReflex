[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreflex"
version = "0.1.0"
description = "Local System 1 reflex decision engine for coding agents"
dependencies = [
    "laya>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "tree-sitter<0.22; python_version<'3.10'",
    "tree-sitter-languages>=1.10.0; python_version<'3.10'",
    "tree-sitter-language-pack>=0.9.0; python_version>='3.10'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon*", "lib*"]
